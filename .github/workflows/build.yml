name: Build images

# Publishing happens on main only (as in vre-hub/environments): merge a
# change, CI publishes tree-<hash>, then pin that tag in rp1-core. PRs run
# the same build + smoke test without pushing, so a broken image is caught
# before merge, not after.
on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - "envs/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "images/**"
      - "envs/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Analysis images run several GB each. Reclaim the runner's
      # preinstalled toolchains so the builds fit on disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Needed even without pushing: parents are private ghcr packages, and
      # the skip check reads the registry.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test${{ github.ref == 'refs/heads/main' && ', push' || '' }}
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: scripts/build-images ${{ github.ref == 'refs/heads/main' && '--push' || '' }}
